<!-- Specifies document type -->
<!doctype html>
<!-- 
  Also specifies the language of 
  the document as english
 -->
<html lang="en">
  <head>
    <!--Title seen in the browser tab -->
    <title>My first website</title>
    <!-- Use CSS to apply styles to specified HTML elements (of a certain class) -->
    <style>
      img {
        width: 100px;
        border-radius: 50px;
        float: left;
        margin-right: 10px;
      }
      .username {
        font-weight: bold;
      }
      button.subscribe-button {
        background-color: rgb(200, 0, 0);
        color: white;
        cursor: pointer; /*Changes mouse icon when hovering above*/
        border: none;
        width: 105px;
        height: 36px;
        border-radius: 2px;
        margin-right: 10px;
        transition: opacity 0.15s; /*Changes the speed of the opacity when hovering above or clicking on the button*/
      }
      button.subscribe-button:hover{ /*hover is a pseudo-class (adding extra styles when hovering above)*/
        /*background-color: rgb(0, 0, 200); /*Changes background color when hovering above*/
        opacity: 0.5; /*Changes transparency when hovering above*/
      }
      button.subscribe-button:active{ /*active is a pseudo-class (adding extra styles when clicking on the button)*/
        /*background-color: rgb(0, 255, 0); /*Changes background color when clicking on the button*/
        opacity: 0.2; /*Changes transparency when clicking on the button*/
      }
      .join-button {
        background-color: white;
        color: rgb(41, 118, 211);
        cursor: pointer; /*Changes mouse icon when hovering above*/
        width: 62px;
        height: 36px;
        border-radius: 2px;
        border-color: rgb(41, 118, 211);
        border-width: 1px;
        font-weight: bold;
        font-size: 14px;
        border-style: solid;
        margin-right: 2px;
        transition: background-color 0.15s, color 0.15s; /*Changes the speed of the background-color and color when hovering above or clicking on the button*/
      }
      .join-button:hover{
        background-color:rgb(41,118,211);
        color: white;
        opacity: 0.6;
      }

      .join-button:active{
        opacity: 0.3;
      }

      .tweet-button {
        font-style: normal;
        border-radius: 18px;
        width: 74px;
        height: 36px;
        color: white;
        background-color: rgb(2, 158, 255);
        border: none;
        cursor: pointer;
        margin-left: 8px;
        font-size:15px;
        font-weight: bold;
        transition: box-shadow 0.15s; 
      }
      .tweet-button:hover{
        opacity:0.7;
        box-shadow: 5px 5px 10px rgba(0,0,0,.15); /*Adds a shadow to the button*/
      }
      .tweet-button:active{
        opacity:0.3;
      }

      .first_div {
        background-color: lightgreen;
        font-family: Franklin Gothic Medium;
        padding: 10px;
      }
    </style>
  </head>
  <body>
     <h2>Header 2</h2>
     <img src="images/earth.png" alt="An image of Earth">
     <br>
     <!-- Write paragraphs -->
    <br><br><br>&nbsp;
    <div class="first_div">   
      <h3>Header 3 </h3>
      <h4>Header 4 </h4>
      <p class="username">@iykejerry</p>
      <p>I am &nbsp;&nbsp;&nbsp; learning HTML.</p>
    </div>
    <button onclick="alert('Button clicked!')">Click here with an alert</button>
    <br>
    <button class="subscribe-button" type="button">SUBSCRIBE</button>
    <button class="join-button">JOIN</button>
    <button class="tweet-button">Tweet</button>
  </body>
</html>
