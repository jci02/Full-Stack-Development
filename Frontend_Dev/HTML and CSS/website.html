<!-- Specifies document type -->
<!doctype html>
<!-- 
  Also specifies the language of 
  the document as english
 -->
<html lang="en">
  <head>
    <!--Title seen in the browser tab -->
    <title>My first website</title>
    <!-- Use CSS to apply styles to specified HTML elements (of a certain class) -->
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <img src="images/earth.png" alt="An image of Earth" />
    <!-- Write paragraphs -->
    <p class="username">@iykejerry</p>
    <p>I am &nbsp;&nbsp;&nbsp; learning HTML.</p>
    <button onclick="alert('Button clicked!')">Click here with an alert</button>
    <br>
    <button class="Subscribe" type="button">Subscribe</button>
    <button class="Join">Join</button>
    <button class="Tweet">Tweet</button>
  </body>
</html>
