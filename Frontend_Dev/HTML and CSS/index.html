<!-- Specifies document type -->
<!Doctype html>
<!-- Also specifies the language of the document as english-->
<html lang="en">
  <head>
    <!--Title seen in the browser tab -->
    <title>My first website</title>
    <!-- Use CSS to apply styles to specified HTML elements (of a certain class) -->
    <style>
      img {
        width: 100px;
        border-radius: 50px;
        float: left;
        margin-right: 10px;
      }
      .username {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <img src="images/earth.png" alt="An image of Earth">
    <!-- Write paragraphs -->
    <p class="username">@iykejerry</p>
    <p>I am learning HTML.</p>
  </body>
</html>
